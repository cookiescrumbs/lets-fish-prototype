<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Fish — All waters</title>

<link rel="icon" href="../../public/img/brand/lf-icon-white.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="../../app/assets/stylesheets/tokens.css">
<link rel="stylesheet" href="../../app/assets/stylesheets/components.css">

<style>
/* ==========================================================================
   All waters mockup — the homepage's "All Waters" quick-link, currently a
   greyed "Coming soon" tile. Modelled on AllTrails' Explore page: a
   full-bleed map under the solid forest header, a floating "Explore waters"
   panel on the left listing every water in view, filter pills over the map
   (Water type, Species — nothing else for now, so no "All" master pill), and a Map layers switcher
   top-right.

   The panel and the map are one thing: pan the map and the list re-filters
   to what's in view; hover a water in the list and its pin goes forest and
   the compact selection card (.lf-water-selection-card) pops up on the map.
   No "Planning a trip?" box — that's AllTrails' upsell, not ours.

   Map is live Leaflet + OpenTopoMap (CDN) so the interaction can be felt;
   pins and clusters use the DS classes (.lf-map-pin, .lf-map-cluster). The
   water list reuses .lf-water-card with an image carousel bolted on. Only the
   page shell (.aw-*) is new CSS.
   ========================================================================== */

/* --------------------------------------------------------------------------
   Page shell — map fills the viewport under the nav; everything else floats.
   -------------------------------------------------------------------------- */
.aw-page  { position: relative; display: flex; flex-direction: column; height: calc(100vh - var(--nav-h)); height: calc(100dvh - var(--nav-h)); min-height: 560px; overflow: hidden; background: var(--bg-alt); }
.aw-stage { position: relative; flex: 1; min-height: 0; }   /* the map and everything floating over it */
.aw-map   { position: absolute; inset: 0; z-index: 0; }
.aw-map .leaflet-control-attribution { font-family: var(--font-ui); font-size: 0.7rem; color: var(--muted); background: rgba(255,255,255,0.85); }
.aw-map .leaflet-control-attribution a { color: var(--forest); }

/* --------------------------------------------------------------------------
   Explore panel — floating sheet on the left. Header + search + count row are
   fixed; the water list scrolls.
   -------------------------------------------------------------------------- */
.aw-panel {
  position: absolute; z-index: 500; top: 1.25rem; left: 1.25rem; bottom: 1.25rem;
  width: 380px; display: flex; flex-direction: column;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); overflow: hidden;
  transition: height 0.2s ease;
}
.aw-panel__banner, .aw-panel__filters { display: none; }   /* phone list view only */
.aw-panel__head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem 1.25rem 0.75rem; }
.aw-panel__title { font-size: 1.45rem; font-weight: 800; color: var(--heading); letter-spacing: -0.015em; }
.aw-panel__collapse {
  width: 2.1rem; height: 2.1rem; border-radius: 50%; border: none; cursor: pointer;
  background: var(--chip-bg); color: var(--forest); font-size: 0.9rem;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background 0.15s ease;
}
.aw-panel__collapse:hover { background: var(--stone); }
.aw-panel__collapse i { transition: transform 0.2s ease; }
.aw-panel__search { padding: 0 1.25rem 0.75rem; }
.aw-panel__count-row { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1.25rem 0.9rem; border-bottom: 1px solid var(--border); }
.aw-panel__count { font-size: 0.9rem; font-weight: 600; color: var(--text); }
.aw-panel__sort { display: inline-flex; align-items: center; gap: 0.4rem; background: none; border: none; cursor: pointer; font: inherit; font-size: 0.9rem; font-weight: 600; color: var(--forest); }
.aw-panel__sort i { font-size: 0.7rem; }
.aw-panel__list { flex: 1; overflow-y: auto; padding: 1rem 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
.aw-panel__empty { padding: 2rem 1.25rem; text-align: center; color: var(--muted); font-size: 0.9rem; }

/* collapsed: just the head row, pinned to the top */
.aw-panel--collapsed { bottom: auto; }
.aw-panel--collapsed .aw-panel__search,
.aw-panel--collapsed .aw-panel__count-row,
.aw-panel--collapsed .aw-panel__list { display: none; }
.aw-panel--collapsed .aw-panel__head { padding-bottom: 1.25rem; }
.aw-panel--collapsed .aw-panel__collapse i { transform: rotate(180deg); }

/* --------------------------------------------------------------------------
   Water card in the panel — .lf-water-card single-column, with a hover state
   that mirrors the map (the hovered water's pin goes forest) and a 3-image
   carousel on the thumbnail.
   -------------------------------------------------------------------------- */
.aw-card { flex-shrink: 0; height: auto; cursor: pointer; }   /* height: 100% is for the grid; here it would stretch to the panel */
.aw-card--active { border-color: var(--forest); box-shadow: 0 0 0 2px var(--forest), var(--shadow-md); }
.aw-card .lf-water-card__image-wrap { aspect-ratio: 16 / 10; }
.aw-card__nav {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
  width: 2.2rem; height: 2.2rem; border: none; border-radius: 50%; cursor: pointer;
  background: rgba(255,255,255,0.9); color: var(--forest); font-size: 0.85rem;
  display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);
  opacity: 0; transition: opacity 0.15s ease;
}
.aw-card:hover .aw-card__nav { opacity: 1; }
.aw-card__nav--prev { left: 0.6rem; }
.aw-card__nav--next { right: 0.6rem; }
.aw-card__dots { position: absolute; bottom: 0.6rem; left: 0; right: 0; z-index: 2; display: flex; justify-content: center; gap: 0.3rem; }
.aw-card__dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.55); }
.aw-card__dot--on { background: #fff; }

/* --------------------------------------------------------------------------
   Filter bar — floating pills over the map, to the right of the panel.
   "All" opens the full filter sheet (not mocked); Water type and Species are
   the only two facets for now.
   -------------------------------------------------------------------------- */
.aw-topbar { position: absolute; z-index: 500; top: 1.25rem; left: calc(380px + 2.5rem); right: 1.25rem; pointer-events: none; }
.aw-topbar > * { pointer-events: auto; }
.aw-topbar__search, .aw-search-btn { display: none; }   /* phone only — on desktop the search lives in the panel */
.aw-filters { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.aw-filter { position: relative; }
.aw-filter__btn {
  display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer;
  min-height: 34px; padding: 0 0.9rem; border-radius: var(--radius-pill);
  background: #fff; border: 1.5px solid var(--border); box-shadow: var(--shadow-sm);
  font: inherit; font-size: 0.85rem; font-weight: 600; color: var(--text); white-space: nowrap;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.aw-filter__btn:hover { border-color: var(--forest); }
.aw-filter__btn i.caret { font-size: 0.7rem; color: var(--muted); }
.aw-filter--active .aw-filter__btn,
.aw-filter--open .aw-filter__btn { border-color: var(--forest); color: var(--forest); }
.aw-filter--open .aw-filter__btn i.caret { transform: rotate(180deg); }

.aw-filter__menu {
  display: none; position: absolute; top: calc(100% + 0.6rem); left: 0; width: max-content; max-width: 460px;
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-md); padding: 1rem;
}
.aw-filter--open .aw-filter__menu { display: block; }
/* options are icon + label tiles; a picked tile gets the forest outline */
.aw-filter__grid { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.aw-filter__option {
  display: inline-flex; align-items: center; gap: 0.65rem; cursor: pointer;
  padding: 0.6rem 0.9rem; border-radius: var(--radius-md); border: 1px solid var(--border); background: #fff;
  font: inherit; font-size: 0.88rem; font-weight: 600; color: var(--text);
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
}
.aw-filter__option:hover { border-color: var(--forest); }
.aw-filter__option i { font-size: 1rem; color: var(--forest); }
.aw-filter__option .n { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
.aw-filter__option--on { border-color: var(--forest); box-shadow: inset 0 0 0 1px var(--forest); background: var(--forest-tint); color: var(--forest); }

/* sheet-only chrome — handle, title row, Clear / Apply. Desktop menus hide it. */
.aw-filter__sheet-head, .aw-filter__sheet-foot, .aw-filter__handle, .aw-sheet-close { display: none; }
.aw-sheet-close { position: static; }   /* shared .lf-modal__close, sat in the sheet's head row rather than pinned to a corner */
.aw-backdrop { display: none; position: fixed; inset: 0; z-index: 900; background: rgba(34, 69, 63, 0.55); }   /* the .lf-modal scrim */   /* one dim layer behind any open sheet */

/* picked options also sit in the bar as removable chips, after the facet pills */
.aw-chip {
  display: inline-flex; align-items: center; gap: 0.6rem; cursor: pointer;
  min-height: 34px; padding: 0 0.7rem 0 0.9rem; border-radius: var(--radius-pill);
  background: #fff; color: var(--forest); border: 1.5px solid var(--forest); box-shadow: var(--shadow-sm);
  font: inherit; font-size: 0.85rem; font-weight: 600; white-space: nowrap; flex-shrink: 0;
}
.aw-chip i { font-size: 0.85rem; color: var(--muted); }
.aw-chip:hover i { color: var(--forest); }

/* --------------------------------------------------------------------------
   Map layers — top-right card with three tile-style thumbnails.
   -------------------------------------------------------------------------- */
.aw-rail { position: absolute; z-index: 500; top: 1.25rem; right: 1.25rem; display: flex; flex-direction: column; align-items: flex-end; gap: 1rem; }
.aw-layers {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-md); padding: 0.75rem 0.85rem;
}
.aw-layers__title { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 700; color: var(--heading); margin-bottom: 0.6rem; }
.aw-layers__title i { font-size: 0.7rem; color: var(--muted); }
.aw-layers__row { display: flex; gap: 0.5rem; }
.aw-layer {
  width: 48px; cursor: pointer; border: none; background: none; padding: 0; font: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
}
.aw-layer__thumb {
  width: 48px; height: 48px; border-radius: var(--radius-sm); overflow: hidden;
  border: 2px solid transparent; transition: border-color 0.15s ease;
}
.aw-layer__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.aw-layer__label { font-size: 0.68rem; font-weight: 600; color: var(--muted); }
.aw-layer:hover .aw-layer__thumb { border-color: var(--stone); }
.aw-layer--active .aw-layer__thumb { border-color: var(--forest); }
.aw-layer--active .aw-layer__label { color: var(--forest); }

/* --------------------------------------------------------------------------
   Map controls — zoom / locate stacked under the layers card. Replaces
   Leaflet's default control so the chrome is on-brand.
   -------------------------------------------------------------------------- */
.aw-controls { display: flex; flex-direction: column; gap: 0.5rem; }
.aw-control {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer;
  background: #fff; color: var(--forest); font-size: 1rem; box-shadow: var(--shadow-sm);
  display: inline-flex; align-items: center; justify-content: center;
}
.aw-control:hover { background: var(--forest-tint); }
.aw-control--quick-layer { display: none; }   /* phone: an icon button, same chrome as + / − */

/* List | Map switch — mobile only. The shared .lf-toggle (nearby-waters'
   toolbar control), floated at the foot of the screen; it flips between the
   two full-screen views and shows which one you're on. */
.aw-view-toggle { display: none; position: absolute; z-index: 600; left: 50%; bottom: 2.25rem; transform: translateX(-50%); background: #fff; box-shadow: var(--shadow-lg); }

/* Mobile selection card — tap a pin and the water's card docks to the foot of
   the map (no hover popup on touch). The List pill rides up above it. */
.aw-mobile-card { display: none; position: absolute; z-index: 550; left: 0.75rem; right: 0.75rem; bottom: 0.75rem; }
.aw-mobile-card .lf-water-selection-card { width: auto; }
.aw-mobile-card .lf-water-selection-card__link { padding: 0.75rem; gap: 0.9rem; }
.aw-mobile-card .lf-water-selection-card__img { width: 96px; height: 96px; }
.aw-mobile-card .lf-water-selection-card__name { font-size: 1.05rem; white-space: normal; }
.aw-mobile-card .lf-water-selection-card__loc { font-size: 0.85rem; color: var(--muted); }
.aw-mobile-card .lf-water-selection-card__type,
.aw-mobile-card .lf-water-selection-card__species { font-size: 0.82rem; }
/* the selection card's own close rules come later in components.css than
   .lf-modal__close, so restate the modal close here to win the cascade */
.aw-mobile-card .lf-water-selection-card__close { top: 0.75rem; right: 0.75rem; width: 2.25rem; height: 2.25rem;
  background: var(--bg); border: 1.5px solid var(--border); color: var(--muted); font-size: 0.9rem; }
.aw-mobile-card .lf-water-selection-card__close:hover { background: var(--cta-bg); color: var(--forest); }


/* --------------------------------------------------------------------------
   Leaflet overrides — strip the default popup chrome so the DS selection
   card is the whole popup; drop the default cluster styling.
   -------------------------------------------------------------------------- */
.aw-pin-wrap, .aw-cluster-wrap { background: none; border: none; }
.lf-water-selection-card__loc { font-size: 0.74rem; color: var(--muted); }   /* location line — candidate for components.css on port */
.aw-hover-popup .leaflet-popup-content-wrapper { background: none; box-shadow: none; padding: 0; border-radius: 0; }
.aw-hover-popup .leaflet-popup-content { margin: 0; line-height: inherit; width: auto !important; }
.aw-hover-popup .leaflet-popup-tip-container { display: none; }
.aw-hover-popup .lf-water-selection-card__close { display: none; }  /* hover card: moving away dismisses it */

/* --------------------------------------------------------------------------
   Mobile — the AllTrails phone layout. Search and the filter row sit in a
   static bar under the nav; below it, EITHER the map OR the list fills the
   screen, and the floating "List" / "Map" pill flips between them. Hover
   doesn't exist here, so tapping a pin opens the selection card.
   -------------------------------------------------------------------------- */
@media (max-width: 860px) {
  .aw-page { min-height: 0; }
  /* pills float over the map, no bar behind them; the rail and the list start below them */
  .aw-topbar { top: 0.75rem; left: 0; right: 0; }
  .aw-filters { flex-wrap: nowrap; overflow-x: auto; padding: 0.1rem 0.75rem; gap: 0.4rem; scrollbar-width: none; }
  .aw-filters::-webkit-scrollbar { display: none; }
  .aw-filter { flex-shrink: 0; }
  /* pills: same 42px tap height, lighter everything else */
  .aw-filter__btn { padding: 0 0.8rem; font-size: 0.82rem; }
  .aw-filter__btn i.caret { font-size: 0.6rem; }
  .aw-chip { padding: 0 0.65rem 0 0.8rem; font-size: 0.82rem; }
  /* search: a round magnifier at the start of the row, opening a sheet */
  .aw-search-btn { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    border: 1.5px solid var(--border); background: #fff; color: var(--forest); font-size: 0.95rem; cursor: pointer; box-shadow: var(--shadow-sm); }
  .aw-topbar__search { position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; background: var(--bg);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 0.6rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom)); box-shadow: var(--shadow-lg); }
  .aw-page--search .aw-topbar__search { display: block; }
  .aw-page--search .aw-topbar { z-index: 1000; }
  .aw-page--search .aw-view-toggle, .aw-page--search .aw-rail { display: none; }
  .aw-filter__sheet-foot--one { grid-template-columns: 1fr; }
  /* the tile menu becomes a bottom sheet, clear of the scrolling pill row */
  .aw-filter__menu { position: fixed; z-index: 1000; top: auto; left: 0; right: 0; bottom: 0; width: auto; max-width: none; max-height: 88vh;
    display: none; flex-direction: column; border-radius: var(--radius-lg) var(--radius-lg) 0 0; border: none; background: var(--bg);
    padding: 0.6rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom)); box-shadow: var(--shadow-lg); }
  .aw-filter--open .aw-filter__menu { display: flex; }
  .aw-sheet-close { display: inline-flex; }
  .aw-filter__handle { display: block; width: 44px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 1.5rem; }
  .aw-filter__sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .aw-filter__sheet-title { font-size: 1.35rem; font-weight: 800; color: var(--heading); letter-spacing: -0.015em; }
  .aw-filter__grid { overflow-y: auto; gap: 0.75rem; }
  .aw-filter__option { padding: 0.7rem 0.9rem; font-size: 0.95rem; }
  .aw-filter__option .n { display: none; }
  /* three water types: one row, equal widths */
  .aw-filter[data-facet="type"] .aw-filter__grid { display: grid; grid-template-columns: repeat(3, 1fr); }
  .aw-filter[data-facet="type"] .aw-filter__option { justify-content: center; padding: 0.7rem 0.5rem; }
  .aw-filter__sheet-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
  .aw-filter__clear, .aw-filter__apply { min-height: 42px; border-radius: var(--radius-pill); font: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
  .aw-filter__clear { background: #fff; border: 2px solid var(--border); color: var(--forest); }
  .aw-filter__clear:disabled { color: var(--muted); border-color: var(--border); opacity: 0.6; cursor: default; }
  .aw-filter__apply { background: var(--forest); color: #fff; border: none; }

  /* panel is the full-screen list view */
  .aw-panel { inset: 0; width: auto; border: none; border-radius: 0; box-shadow: none; background: var(--bg); display: none; }
  .aw-panel__head, .aw-panel__search { display: none; }
  .aw-panel__banner { display: block; padding: 1.25rem 0 1rem; }
  .aw-panel__banner .lf-explore-banner__search { max-width: none; }
  .aw-panel__filters { display: block; border-bottom: 1px solid var(--border); }
  .aw-panel__filters .aw-filters { padding: 0.75rem 1rem; }
  .aw-panel__filters .aw-search-btn { display: none; }   /* the banner has the search bar */
  .aw-panel__filters .aw-filter__btn, .aw-panel__filters .aw-chip { box-shadow: none; }
  .aw-panel__count-row { padding: 0.9rem 1rem; }
  .aw-panel__list { padding: 1rem 1rem calc(5rem + env(safe-area-inset-bottom)); }
  .aw-card__nav { display: none; }   /* swipe on touch; dots stay */

  .aw-page--list .aw-panel { display: flex; overflow-y: auto; }
  .aw-page--list .aw-panel > * { flex-shrink: 0; }   /* banner and pills keep their height; the panel scrolls instead */
  .aw-page--list .aw-panel__list { flex: none; overflow: visible; }   /* the whole panel scrolls, banner included */
  .aw-page--list:has(.aw-filter--open) .aw-panel { z-index: 1000; }   /* pills live in the panel here: lift it for its sheet */
  .aw-page--list .aw-map, .aw-page--list .aw-rail { display: none; }

  /* right rail: layers, then + / −, all the same 36px round button */
  .aw-rail { top: calc(0.75rem + 34px + 0.75rem); right: 0.75rem; }
  .aw-control--quick-layer { display: inline-flex; order: -1; }
  /* the layers card becomes a bottom sheet, opened from the quick thumb */
  .aw-layers { display: none; position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; border: none; background: var(--bg);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom)); box-shadow: var(--shadow-lg); }
  .aw-page--layers .aw-layers { display: block; }
  .aw-layers__title { justify-content: space-between; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.015em; margin-bottom: 1.25rem; }
  .aw-layers__title > i { display: none; }
  .aw-layers__row { gap: 1rem; }
  .aw-layer { width: 80px; gap: 0.4rem; }
  .aw-layer__thumb { width: 80px; height: 80px; border-radius: var(--radius-md); }
  .aw-layer__label { font-size: 0.9rem; }

  .aw-view-toggle { display: inline-flex; }
  .aw-view-toggle .lf-toggle__btn { min-height: 0; }

  /* while a sheet is open it owns the screen: its container is lifted above
     everything, and the List pill and rail buttons are hidden underneath */
  .aw-page:has(.aw-filter--open) .aw-topbar { z-index: 1000; }
  .aw-page:has(.aw-filter--open) > .aw-backdrop, .aw-page--search > .aw-backdrop, .aw-page--layers > .aw-backdrop { display: block; }
  .aw-page:has(.aw-filter--open) .aw-view-toggle,
  .aw-page:has(.aw-filter--open) .aw-rail,
  .aw-page--layers .aw-view-toggle,
  .aw-page--layers .aw-control { display: none; }
  .aw-page--layers .aw-rail { z-index: 1000; }
  .aw-page--card .aw-mobile-card { display: block; }
  .aw-page--card .aw-view-toggle { bottom: calc(0.75rem + 122px + 0.75rem); }   /* rides up above the docked card */
  .aw-page--list .aw-mobile-card { display: none; }
}
</style>
</head>
<body>

<!-- ════════════════════════ Solid forest header ════════════════════════ -->
<nav class="lf-nav lf-nav--solid">
  <div class="lf-nav__inner">
    <a class="lf-nav__brand" href="homepage.html">
      <img class="roundel"  src="../../public/img/brand/lf-icon-white.svg" alt="">
      <img class="wordmark" src="../../public/img/brand/lf-type-white-landscape.svg" alt="Let's Fish">
    </a>
    <div class="lf-nav__actions">
      <a class="lf-nav__link" href="#">Add your fishery</a>
      <a class="lf-nav__btn lf-nav__btn--outline" href="#">Sign in</a>
      <a class="lf-nav__btn lf-nav__btn--primary" href="#">Sign up</a>
    </div>
  </div>
</nav>

<main class="aw-page" id="aw-page">

  <!-- ──────────────── Top bar: filter pills (desktop: floating over the map; mobile: static row + search) ──────────────── -->
  <div class="aw-topbar">
    <div class="aw-topbar__search" id="aw-search-sheet">
      <div class="aw-filter__handle"></div>
      <div class="aw-filter__sheet-head">
        <h2 class="aw-filter__sheet-title">Search</h2>
        <button type="button" class="lf-modal__close aw-sheet-close" data-search-close aria-label="Close">&#x2715;</button>
      </div>

  { name: 'Loch Long',              loc: 'Arrochar, Argyll',         type: 'Coastal', species: ['Mackerel', 'Pollack'],           lat: 56.15, lng: -4.85, desc: 'Deep sea loch at the foot of the Arrochar Alps. Pier and shore marks at the head of the loch.' },
  { name: 'River Leven',            loc: 'Balloch, West Dunbartonshire', type: 'River', species: ['Salmon', 'Sea trout'],        lat: 55.98, lng: -4.58, desc: 'Short and fast from Loch Lomond to the Clyde, with every Lomond salmon passing through it.' },
  { name: 'Loch Voil',              loc: 'Balquhidder, Stirling',    type: 'Lake',    species: ['Brown trout', 'Pike'],           lat: 56.35, lng: -4.42, desc: 'Rob Roy\'s glen. A quiet loch fished from the single-track road along the north shore.' }
]

// ---------------------------------------------------------------------------
// Map — OpenTopoMap, the DS pins and clusters.
// ---------------------------------------------------------------------------
const LAYERS = {
  topo:      L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: 'Map data: &copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="https://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a>' }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Imagery &copy; Esri' }),
  standard:  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Tiles &copy; Esri' })
}

const page = document.getElementById('aw-page')
const isMobile = () => window.matchMedia('(max-width: 860px)').matches

const map = L.map('aw-map', { zoomControl: false, scrollWheelZoom: true }).setView([56.18, -4.42], 10)
let activeLayer = LAYERS.topo.addTo(map)

const pinIcon = (selected) => L.divIcon({
  className: 'aw-pin-wrap',
  html: `<div class="lf-map-pin${selected ? ' lf-map-pin--selected' : ''}"><i class="fa-solid fa-fish"></i></div>`,
  iconSize: [36, 36], iconAnchor: [18, 18]
})
const clusterIcon = (cluster) => {
  const n = cluster.getChildCount()
  const size = n >= 50 ? ' lf-map-cluster--lg' : n >= 10 ? ' lf-map-cluster--md' : ''
  const px = n >= 50 ? 52 : n >= 10 ? 44 : 36
  return L.divIcon({ className: 'aw-cluster-wrap', html: `<div class="lf-map-cluster${size}">${n}</div>`, iconSize: [px, px], iconAnchor: [px / 2, px / 2] })
}

const clusterGroup = L.markerClusterGroup({ iconCreateFunction: clusterIcon, showCoverageOnHover: false, maxClusterRadius: isMobile() ? 70 : 40 })
map.addLayer(clusterGroup)

WATERS.forEach((w, i) => {
  w.id = i
  w.marker = L.marker([w.lat, w.lng], { icon: pinIcon(false) })
  w.marker.on('mouseover', () => select(w))
  w.marker.on('mouseout',  () => { if (!isMobile()) deselect() })   // touch: the docked card stays until dismissed
  w.marker.on('click',     () => select(w))   // touch: tap a pin to open its card
})

const selectionCard = (w) => `
  <div class="lf-water-selection-card">
    <a class="lf-water-selection-card__link" href="waters-show.html">
      <img class="lf-water-selection-card__img" src="${img(w.id, 192, 192)}" alt="">
      <div class="lf-water-selection-card__info">
        <span class="lf-water-selection-card__name">${w.name}</span>
        <span class="lf-water-selection-card__loc">${w.loc}</span>
        <span class="lf-water-selection-card__type"><i class="fa-solid ${TYPE_ICON[w.type]}"></i> ${w.type}</span>
        <span class="lf-water-selection-card__species"><i class="fa fa-fish"></i> ${w.species.join(', ')}</span>
      </div>
    </a>
    <button class="lf-water-selection-card__close${isMobile() ? ' lf-modal__close' : ''}" type="button" aria-label="Close">${isMobile() ? '&#x2715;' : '<i class="fa-solid fa-xmark"></i>'}</button>
  </div>`

let hoverPopup = null
let selected = null
function select(w) {
  if (selected === w) return
  deselect()
  selected = w
  w.marker.setIcon(pinIcon(true))
  if (isMobile()) {
    const dock = document.getElementById('aw-mobile-card')
    dock.innerHTML = selectionCard(w)
    dock.querySelector('.lf-water-selection-card__close').addEventListener('click', deselect)
    page.classList.add('aw-page--card')
    return
  }
  hoverPopup = L.popup({ className: 'aw-hover-popup', closeButton: false, autoPan: false, offset: [0, -22] })
    .setLatLng([w.lat, w.lng]).setContent(selectionCard(w)).openOn(map)
  document.querySelector(`.aw-card[data-id="${w.id}"]`)?.classList.add('aw-card--active')
}
function deselect() {
  if (!selected) return
  selected.marker.setIcon(pinIcon(false))
  document.querySelector(`.aw-card[data-id="${selected.id}"]`)?.classList.remove('aw-card--active')
  if (hoverPopup) { map.closePopup(hoverPopup); hoverPopup = null }
  page.classList.remove('aw-page--card')
  selected = null
}

// ---------------------------------------------------------------------------
// Filters — Water type and Species. Both facets AND together; options within
// a facet OR. Counts in the menu reflect the other facet + the search box.
// ---------------------------------------------------------------------------
const filters = { type: new Set(), species: new Set() }
let query = ''

const matchesSearch  = (w) => !query || [w.name, w.loc, ...w.species].join(' ').toLowerCase().includes(query)
const matchesType    = (w) => !filters.type.size || filters.type.has(w.type)
const matchesSpecies = (w) => !filters.species.size || w.species.some(s => filters.species.has(s))
const visible = () => WATERS.filter(w => matchesSearch(w) && matchesType(w) && matchesSpecies(w))

document.querySelectorAll('.aw-filter[data-facet]').forEach(el => {
  const facet = el.dataset.facet
  el.querySelector('[data-toggle]').addEventListener('click', (e) => {
    e.stopPropagation()
    const open = el.classList.contains('aw-filter--open')
    closeMenus()
    if (!open) el.classList.add('aw-filter--open')
  })
  el.querySelectorAll('.aw-filter__option').forEach(btn => btn.addEventListener('click', () => {
    const v = btn.dataset.value
    filters[facet].has(v) ? filters[facet].delete(v) : filters[facet].add(v)
    applyFilters()
  }))
  el.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeMenus))
  el.querySelector('[data-clear]').addEventListener('click', () => { filters[facet].clear(); applyFilters() })
  el.querySelector('.aw-filter__menu').addEventListener('click', e => e.stopPropagation())
})
document.getElementById('aw-backdrop').addEventListener('click', () => { closeMenus(); page.classList.remove('aw-page--search', 'aw-page--layers') })
document.addEventListener('click', closeMenus)
function closeMenus() { document.querySelectorAll('.aw-filter--open').forEach(el => el.classList.remove('aw-filter--open')) }

const FACET_ICON = { type: (v) => TYPE_ICON[v], species: () => 'fa-fish' }
const LABEL = { Lake: 'Lakes', River: 'Rivers' }
function renderChips() {
  const chips = document.getElementById('aw-chips')
  chips.innerHTML = ['type', 'species'].flatMap(facet => [...filters[facet]].map(v =>
    `<button type="button" class="aw-chip" data-facet="${facet}" data-value="${v}">${LABEL[v] || v} <i class="fa-solid fa-xmark"></i></button>`
  )).join('')
}
document.getElementById('aw-chips').addEventListener('click', (e) => {
  const chip = e.target.closest('.aw-chip'); if (!chip) return
  filters[chip.dataset.facet].delete(chip.dataset.value)
  applyFilters()
})

function applyFilters() {
  deselect()
  clusterGroup.clearLayers()
  visible().forEach(w => clusterGroup.addLayer(w.marker))

  document.querySelectorAll('.aw-filter[data-facet]').forEach(el => {
    const facet = el.dataset.facet
    el.classList.toggle('aw-filter--active', filters[facet].size > 0)
    el.querySelectorAll('.aw-filter__option').forEach(b => b.classList.toggle('aw-filter__option--on', filters[facet].has(b.dataset.value)))
    el.querySelector('[data-clear]').disabled = filters[facet].size === 0
    el.querySelectorAll('[data-n]').forEach(n => {
      const v = n.dataset.n
      const pool = WATERS.filter(w => matchesSearch(w) && (facet === 'type' ? matchesSpecies(w) : matchesType(w)))
      n.textContent = pool.filter(w => facet === 'type' ? w.type === v : w.species.includes(v)).length
    })
  })
  renderChips()
  renderList()
}

document.querySelectorAll('[data-search]').forEach(input => input.addEventListener('input', (e) => {
  query = e.target.value.trim().toLowerCase()
  document.querySelectorAll('[data-search]').forEach(o => { if (o !== input) o.value = e.target.value })
  applyFilters()
}))

// ---------------------------------------------------------------------------
// List — what's in view, in the panel. Pan or zoom and it re-renders.
// ---------------------------------------------------------------------------
const list = document.getElementById('aw-list')
const count = document.getElementById('aw-count')

const card = (w, slide = 0) => `
  <article class="lf-water-card aw-card" data-id="${w.id}" data-slide="${slide}">
    <div class="lf-water-card__image-wrap">
      <a class="lf-water-card__link" href="waters-show.html">
        <img class="lf-water-card__img" alt="${w.name}" src="${img(w.id + slide, 640, 400)}">
      </a>
      <button type="button" class="aw-card__nav aw-card__nav--prev" data-step="-1"><i class="fa-solid fa-arrow-left"></i></button>
      <button type="button" class="aw-card__nav aw-card__nav--next" data-step="1"><i class="fa-solid fa-arrow-right"></i></button>
      <div class="aw-card__dots">${[0,1,2].map(i => `<span class="aw-card__dot${i === slide ? ' aw-card__dot--on' : ''}"></span>`).join('')}</div>
      <div class="lf-water-card__hearts">
        <a class="lf-water-card__heart" href="#" title="Add to fishlist"><i class="fa-solid fa-heart-circle-plus"></i></a>
      </div>
    </div>
    <div class="lf-water-card__body">
      <a class="lf-water-card__title-link" href="waters-show.html"><h3 class="lf-water-card__title">${w.name}</h3></a>
      <p class="lf-water-card__location">${w.loc}</p>
      <p class="lf-water-card__desc">${w.desc}</p>
      <div class="lf-water-card__meta">
        <span class="lf-water-card__tag"><i class="fa-solid ${TYPE_ICON[w.type]}"></i> ${w.type}</span>
        <span class="lf-water-card__tag"><i class="fa fa-fish"></i> ${w.species.slice(0, 2).join(' &amp; ')}</span>
      </div>
    </div>
  </article>`

function renderList() {
  const bounds = map.getBounds()
  const inView = visible().filter(w => bounds.contains([w.lat, w.lng]))
  count.textContent = `${inView.length} ${inView.length === 1 ? 'water' : 'waters'}`
  list.innerHTML = inView.length
    ? inView.map(w => card(w)).join('')
    : '<p class="aw-panel__empty">No waters here yet. Pan the map, or loosen the filters.</p>'
}

// hover a card → its pin lights up and the selection card pops on the map
list.addEventListener('mouseover', (e) => {
  const el = e.target.closest('.aw-card'); if (!el) return
  select(WATERS[+el.dataset.id])
})
list.addEventListener('mouseleave', deselect)

// carousel arrows step the thumbnail; the stretched title link sits beneath them
list.addEventListener('click', (e) => {
  const btn = e.target.closest('.aw-card__nav'); if (!btn) return
  e.preventDefault()
  const el = btn.closest('.aw-card')
  const w = WATERS[+el.dataset.id]
  const slide = (+el.dataset.slide + +btn.dataset.step + 3) % 3
  el.outerHTML = card(w, slide)
  document.querySelector(`.aw-card[data-id="${w.id}"]`).classList.add('aw-card--active')
})

map.on('moveend', renderList)
map.on('click', () => { if (isMobile()) deselect() })

// ---------------------------------------------------------------------------
// Chrome — collapse, zoom, layers.
// ---------------------------------------------------------------------------
document.getElementById('aw-collapse').addEventListener('click', () => document.getElementById('aw-panel').classList.toggle('aw-panel--collapsed'))
// On the phone the pills float over the map but sit under the banner in the
// list view, so the one .aw-filters node moves between the two homes.
const filtersEl = document.getElementById('aw-filters')
const toggle = document.getElementById('aw-view-toggle')
toggle.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-view]'); if (!btn) return
  const list = btn.dataset.view === 'list'
  page.classList.toggle('aw-page--list', list)
  toggle.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('lf-toggle__btn--active', b === btn))
  if (list) document.getElementById('aw-list-filters').appendChild(filtersEl)
  else { filtersEl.ownerDocument.querySelector('.aw-topbar').appendChild(filtersEl); map.invalidateSize() }
})
document.getElementById('aw-quick-layer').addEventListener('click', () => page.classList.add('aw-page--layers'))
document.getElementById('aw-search-open').addEventListener('click', () => {
  page.classList.add('aw-page--search')
  document.querySelector('#aw-search-sheet [data-search]').focus()
})
document.querySelectorAll('[data-search-close]').forEach(b => b.addEventListener('click', () => page.classList.remove('aw-page--search')))
document.getElementById('aw-layers-close').addEventListener('click', () => page.classList.remove('aw-page--layers'))
document.getElementById('aw-zoom-in').addEventListener('click', () => map.zoomIn())
document.getElementById('aw-zoom-out').addEventListener('click', () => map.zoomOut())
document.getElementById('aw-layers').addEventListener('click', (e) => {
  const btn = e.target.closest('.aw-layer'); if (!btn) return
  document.querySelectorAll('.aw-layer').forEach(b => b.classList.toggle('aw-layer--active', b === btn))
  map.removeLayer(activeLayer)
  activeLayer = LAYERS[btn.dataset.layer].addTo(map)
  page.classList.remove('aw-page--layers')
})

applyFilters()
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Fish — Sign in</title>

<link rel="icon" href="../../public/img/brand/lf-icon-white.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../../app/assets/stylesheets/tokens.css">
<link rel="stylesheet" href="../../app/assets/stylesheets/components.css">

<!-- Sign-in mockup — devise/sessions#new. Everything is shared chrome:
     .lf-auth background (two photos + forest scrim → TRANSPARENT header),
     .lf-auth-card with label-above .field inputs, sunset submit, OAuth
     buttons, cross-link footer. No site footer, matching the Rails view.
     No page-local CSS at all. Skipped (anti-spam / state): flash alerts. -->
</head>
<body>

<div class="lf-auth">
  <div class="lf-auth__bg" aria-hidden="true">
    <img src="https://letsfish.imgix.net/images/images/000/000/659/original/IMG_5949_(1).jpeg?auto=compress&fit=crop&w=960&h=1200" alt="">
    <img src="https://letsfish.imgix.net/images/images/000/000/470/original/Jura_2018_55.jpg?auto=compress&fit=crop&w=960&h=1200" alt="">
  </div>

  <!-- ════════════════════════ Transparent header (over photo scrim) ════════════════════════ -->
  <nav class="lf-nav lf-nav--transparent">
    <div class="lf-nav__inner">
      <a class="lf-nav__brand" href="homepage.html">
        <img class="roundel"  src="../../public/img/brand/lf-icon-white.svg" alt="">
        <img class="wordmark" src="../../public/img/brand/lf-type-white-landscape.svg" alt="Let's Fish">
      </a>
      <div class="lf-nav__actions">
        <a class="lf-nav__link" href="#">Add your fishery</a>
        <a class="lf-nav__btn lf-nav__btn--outline" href="sign-in.html">Sign in</a>
        <a class="lf-nav__btn lf-nav__btn--primary" href="sign-up.html">Sign up</a>
      </div>
    </div>
  </nav>

  <!-- ════════════════════════ Auth card ════════════════════════ -->
  <main class="lf-auth__main">
    <div class="lf-auth-card">
      <h1 class="lf-auth-card__title">Welcome back.<br>Sign in and start exploring.</h1>
      <form class="lf-auth-card__form" onsubmit="return false">
        <div class="field">
          <label class="field__label" for="email">Email address</label>
          <input class="field__input" id="email" type="email" autocomplete="email" autofocus>
        </div>
        <div class="field">
          <label class="field__label" for="password">Password</label>
          <input class="field__input" id="password" type="password" autocomplete="current-password">
        </div>
        <button class="btn btn--accent lf-auth-card__submit" type="submit">Sign In</button>
      </form>
      <a class="lf-auth-card__forgot" href="#">Forgot your password?</a>
      <div class="lf-auth-card__oauth">
        <button class="lf-oauth-btn lf-oauth-btn--google" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/><path d="M9.003 18c2.43 0 4.467-.806 5.956-2.18l-2.909-2.26c-.806.54-1.836.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.96v2.332C2.44 15.983 5.485 18 9.003 18z" fill="#34A853"/><path d="M3.964 10.712c-.18-.54-.282-1.117-.282-1.71 0-.593.102-1.17.282-1.71V4.96H.957C.347 6.175 0 7.55 0 9.002c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9.003 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.428 0 9.002 0 5.485 0 2.44 2.017.96 4.958L3.967 7.29c.708-2.127 2.692-3.71 5.036-3.71z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
        <button class="lf-oauth-btn lf-oauth-btn--apple" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" fill="#fff"/></svg>
          Continue with Apple
        </button>
      </div>
      <p class="lf-auth-card__footer">Don't have an account? <a href="sign-up.html">Sign up</a></p>
    </div>
  </main>
</div>

</body>
</html>
